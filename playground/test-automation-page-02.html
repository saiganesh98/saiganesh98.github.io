<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Appointment</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Georgia, "Times New Roman", serif;
      color: #20332e;
      background: linear-gradient(135deg, #e9f5ef, #f7fbf9 55%, #e7f0f5);
    }

    main {
      width: min(100%, 520px);
      padding: 32px;
      background: #ffffff;
      border: 1px solid #cbded6;
      border-radius: 8px;
      box-shadow: 0 18px 45px rgba(32, 76, 61, 0.12);
    }

    h1 {
      margin: 0 0 8px;
      color: #17624b;
      font-size: 30px;
      letter-spacing: 0;
    }

    .intro {
      margin: 0 0 24px;
      color: #587068;
    }

    .field {
      margin-bottom: 18px;
    }

    label,
    legend {
      display: block;
      margin-bottom: 7px;
      font-weight: 700;
    }

    input,
    select,
    button {
      width: 100%;
      min-height: 44px;
      border: 1px solid #9db8ae;
      border-radius: 5px;
      padding: 10px 12px;
      font: inherit;
    }

    input:focus,
    select:focus {
      outline: 3px solid rgba(35, 134, 102, 0.18);
      border-color: #238666;
    }

    fieldset {
      margin: 0 0 18px;
      padding: 0;
      border: 0;
    }

    .choice {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 8px 0;
      font-weight: 400;
    }

    .choice input {
      width: 18px;
      min-height: 18px;
      margin: 0;
    }

    button {
      border: 0;
      color: #ffffff;
      background: #17624b;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #104b39;
    }

    #confirmation {
      min-height: 24px;
      margin: 18px 0 0;
      color: #17624b;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>Book a Doctor Appointment</h1>
    <p class="intro">Enter your details to request an appointment.</p>

    <form id="appointment-form">
      <div class="field">
        <label for="patient-name">Name</label>
        <input type="text" id="patient-name" name="name" autocomplete="name" required>
      </div>

      <div class="field">
        <label for="patient-age">Age</label>
        <input type="number" id="patient-age" name="age" min="1" max="120" required>
      </div>

      <div class="field">
        <label for="appointment-date">Date of Appointment</label>
        <input type="date" id="appointment-date" name="appointmentDate" required>
      </div>

      <div class="field">
        <label for="gender">Gender</label>
        <select id="gender" name="gender" required>
          <option value="">Select gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>
      </div>

      <fieldset>
        <legend>Visit Type</legend>
        <label class="choice">
          <input type="radio" name="visitType" value="general-consultation" required>
          General consultation
        </label>
      </fieldset>

      <label class="choice">
        <input type="checkbox" id="appointment-consent" name="consent" required>
        I confirm that the appointment details are correct
      </label>

      <button type="submit">Book Appointment</button>
    </form>

    <p id="confirmation" role="status" aria-live="polite"></p>
  </main>

  <script>
    const form = document.getElementById('appointment-form');
    const appointmentDate = document.getElementById('appointment-date');
    const confirmation = document.getElementById('confirmation');

    appointmentDate.min = new Date().toISOString().split('T')[0];

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const patientName = document.getElementById('patient-name').value.trim();
      confirmation.textContent = `Appointment requested successfully for ${patientName}.`;
    });
  </script>
</body>
</html>
